<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

<body>
    <script>
        let db;
        let request = indexedDB.open("myDatabase", 1);

        request.onupgradeneeded = function (event) {
            db = event.target.result;
            db.createObjectStore("users", { keyPath: "id" });
        };

        request.onsuccess = function (event) {
            db = event.target.result;
            console.log("DB connected 👍");
        };
    </script>

    <div class="container">
        <header class="logo-section">
            <div class="logo-container">
                <img src="assets/text logo.png" alt="PEDAL" class="logo-image">
            </div>

        </header>

        <main class="content-section">
            <h2 class="slogan-top">SEN DE</h2>

            <button class="btn btn-large" onclick="window.location.href='auth/signup.html'">KAYDOL</button>

            <div class=" slogan-middle">VE
            </div>

            <h2 class="slogan-bottom">
                <span>PEDAL</span>'LA
            </h2>
        </main>

        <footer class="bottom-section">
            <p class="login-prompt">Hesabın varsa</p>
            <button class="btn btn-small" onclick="window.location.href='auth/login.html'">Giriş
                yap</button>
        </footer>
    </div>
</body>

</html>
